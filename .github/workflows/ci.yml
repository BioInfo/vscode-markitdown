name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: npm ci
      # Compile, lint, plain-Node unit tests, runner functional tests.
      - run: npm test
      # Inside a real VS Code: builds the environment with pip (no uv on the
      # runner) and converts files through the extension command.
      - name: Extension tests (Linux, under a virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:vscode
      - name: Extension tests
        if: runner.os != 'Linux'
        run: npm run test:vscode
